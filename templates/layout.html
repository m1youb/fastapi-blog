<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% if title %}
            FastAPI Blog - {{ title }}
        {% else %}
            FastAPI Blog
        {% endif %}
    </title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div id="nav-content">
            <div id="left-nav">
                <a href="/">
                    <h1 id="logo">My Blog</h1>
                </a>
            </div>
            <div id="right-nav">
                <a id="nav-login-button" class="nav-btn" href="/login">Login</a>
                <a id="nav-signup-button" class="nav-btn" href="/signup">Sign up</a>
            </div>
        </div>

    </nav>
    <main>
        {% block content %}
        {% endblock content %}
    </main>
    <footer>
        <p id="footer-text">© Ayoub Miane 2026</p>
    </footer>
</body>
</html>
