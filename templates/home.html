{% extends "layout.html" %}
{% block content %}
    <h2 class="latest-articles">Latest articles</h2>
    <div id="posts-container">
    {% for post in posts %}
        <div class="post-container">
            <h2>
                <a href="{{ url_for("get_post_page", post_id=post.id) }}" class="post-title">{{ post.title[:50] }}</a>
            </h2>
            <p class="post-content-peak">{{ post.content }}</p>
        </div>
    {% endfor %}
    </div>
{% endblock content %}
