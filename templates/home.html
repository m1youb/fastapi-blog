{% extends "layout.html" %}
{% block content %}
    <h1>Homepage</h1>
    {% for post in posts %}
        <div class="post-container">
            <a href="./posts/{{ post.id }}">
                <h2 class="post-title">{{ post.title[:50] }}</h2>
            </a>
            <p class="post-content-peak">{{ post.content }}</p>
        </div>
    {% endfor %}
{% endblock content %}
