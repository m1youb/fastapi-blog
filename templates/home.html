{% extends "layout.html" %}
{% block content %}
    <h2 class="latest-articles">Latest articles</h2>
    <div id="posts-container">
    {% for post in posts %}
        <div class="post-container">
            <a href="{{ url_for("get_post_page", post_id=post.id) }}" class="post-title">
                <h2 class="post-card-content">{{ post.title[:50] }}</h2>
                <p class="post-content-peak post-card-content">{{ post.content }}</p>
            </a>
        </div>
    {% endfor %}
    </div>
{% endblock content %}
