{% extends "layout.html" %}

{% block content %}
    <h2 id="signup-title">Signup</h2>
    <form>
        <label for="email"></label><input id="email" placeholder="Email" type="email" autocomplete="email">
        <label for="username"></label><input id="username" placeholder="Username" autocomplete="username">
        <label for="password"></label><input id="password" placeholder="Password" type="password">
        <input type="submit" class="auth-form-button" id="sign-up-btn" value="Signup">
    </form>
{% endblock content %}
